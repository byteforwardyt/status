name: build

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v7
      - run: xcodebuild -scheme Status -destination 'platform=macOS' -configuration Release archive CODE_SIGNING_ALLOWED=NO
