name: release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build and sign only: skip notarization and release publishing"
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Import signing certificate
        uses: Apple-Actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.DISTRIBUTION_CERTIFICATE }}
          p12-password: ${{ secrets.DISTRIBUTION_CERTIFICATE_PASSWORD }}

      - name: Archive
        run: xcodebuild -scheme Status -destination 'platform=macOS' -configuration Release archive -archivePath build/Status.xcarchive

      - name: Export
        run: xcodebuild -exportArchive -exportOptionsPlist exportOptions.plist -archivePath build/Status.xcarchive -exportPath build

      - name: Notarize
        if: inputs.dry_run != true
        run: |
          xcrun notarytool submit build/Status.zip \
            --apple-id "${{ secrets.APPLE_ID }}" \
            --team-id "${{ secrets.APPLE_TEAM_ID }}" \
            --password "${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}" \
            --wait

      - name: Staple
        if: inputs.dry_run != true
        run: xcrun stapler staple build/Status.app

      - name: Verify signatures
        run: |
          codesign --verify --strict "build/Status.app/Contents/PlugIns/WidgetsExtension.appex"
          app=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" build/Status.app/Contents/Info.plist)
          widget=$(/usr/libexec/PlistBuddy -c "Print CFBundleShortVersionString" "build/Status.app/Contents/PlugIns/WidgetsExtension.appex/Contents/Info.plist")
          echo "app: $app, widget: $widget"
          [ "$app" = "$widget" ] || { echo "ERROR: widget version does not match app version"; exit 1; }

      - name: Verify gatekeeper
        if: inputs.dry_run != true
        run: spctl -a -t exec -vvv build/Status.app

      - name: DMG
        run: |
          git clone --depth 1 https://github.com/create-dmg/create-dmg
          ./create-dmg/create-dmg \
            --volname Status \
            --background "./Status/Supporting Files/background.png" \
            --window-pos 200 120 \
            --window-size 500 320 \
            --icon-size 80 \
            --icon "Status.app" 125 175 \
            --hide-extension "Status.app" \
            --app-drop-link 375 175 \
            --no-internet-enable \
            build/Status.dmg build/Status.app
          rm -rf ./create-dmg

      - name: Upload DMG
        if: inputs.dry_run == true
        uses: actions/upload-artifact@v4
        with:
          name: Status.dmg
          path: build/Status.dmg

      - name: Publish
        if: inputs.dry_run != true
        uses: softprops/action-gh-release@v2
        with:
          files: build/Status.dmg
